{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>GoTogether – Пошук поїздок</title>

    <!-- ❌ Tailwind ПРИБРАЛИ -->
    <!-- ✅ ПІДКЛЮЧИЛИ СВІЙ CSS -->
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

<header>
    <h1>GoTogether</h1>
    <div class="buttons" id="auth-buttons"></div>
</header>

<main class="container">

    <!-- Форма пошуку -->
    <form id="search-form">
        <div class="form-grid">
            <input type="text" id="origin" placeholder="Місто відправлення">
            <input type="text" id="destination" placeholder="Місто призначення">
            <input type="date" id="date">
        </div>
        <button type="submit">Знайти поїздки</button>
    </form>

    <!-- Результати -->
    <div id="results"></div>

</main>

<script>
// -----------------------------
// Авторизація
// -----------------------------
function renderAuthButtons() {
    const container = document.getElementById('auth-buttons');
    const token = localStorage.getItem('access_token');

    if (token) {
        const username = localStorage.getItem('username') || 'Користувач';
        container.innerHTML = `
            <span>${username}</span>
            <button class="logout" onclick="logout()">Вийти</button>
        `;
    } else {
        container.innerHTML = `
            <button class="login" onclick="location.href='/login/'">Увійти</button>
            <button class="register" onclick="location.href='/register/'">Реєстрація</button>
        `;
    }
}

function logout() {
    localStorage.clear();
    location.reload();
}

renderAuthButtons();

// -----------------------------
// Пошук поїздок
// -----------------------------
document.getElementById('search-form').addEventListener('submit', async e => {
    e.preventDefault();

    const origin = origin.value;
    const destination = destination.value;
    const date = date.value;

    let url = `/api/trips/?`;
    if (origin) url += `origin=${origin}&`;
    if (destination) url += `destination=${destination}&`;
    if (date) url += `departure_date=${date}&`;

    const res = await fetch(url);
    const trips = await res.json();

    const results = document.getElementById('results');
    results.innerHTML = '';

    if (!trips.length) {
        results.innerHTML = '<p>Поїздок не знайдено</p>';
        return;
    }

    trips.forEach(trip => {
        results.innerHTML += `
            <div class="trip-card">
                <h2>${trip.origin} → ${trip.destination}</h2>
                <p>Водій: ${trip.driver.username} (${trip.driver.rating}⭐)</p>
                <p>Дата: ${new Date(trip.departure_time).toLocaleString()}</p>
                <p>Місць: ${trip.seats_available}</p>
                <p>Ціна: ${trip.price} ₴</p>
                <button onclick="bookTrip(${trip.id})">Забронювати</button>
            </div>
        `;
    });
});

// -----------------------------
// Бронювання
// -----------------------------
async function bookTrip(id) {
    const token = localStorage.getItem('access_token');
    if (!token) {
        alert('Спочатку увійдіть');
        return;
    }

    const res = await fetch('/api/bookings/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ trip: id })
    });

    alert(res.ok ? 'Успішно!' : 'Помилка');
}
</script>

</body>
</html>
